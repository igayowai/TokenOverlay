<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#1b1f4b"/>
      <stop offset="1" stop-color="#3b2a7a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.45">
      <stop offset="0" stop-color="#8b7cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b7cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="440" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="440" fill="url(#bg)"/>
    <rect width="1280" height="440" fill="url(#grid)"/>
    <rect width="1280" height="440" fill="url(#glow)"/>
  </g>

  <g font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif">
    <text x="88" y="150" fill="#a5b4fc" font-size="22" font-weight="600" letter-spacing="3">CODEX · CLAUDE · WINDOWS</text>
    <text x="84" y="232" fill="#ffffff" font-size="84" font-weight="800" letter-spacing="-2">TokenOverlay</text>
    <text x="88" y="292" fill="#e0e7ff" font-size="30" font-weight="500">AI가 방금 쓴 토큰 · 시간 · 속도를</text>
    <text x="88" y="336" fill="#e0e7ff" font-size="30" font-weight="500">앱 화면 위에서 바로.</text>
  </g>

  <!-- Capsule, as it sits over the app -->
  <g transform="translate(712 132)" filter="url(#shadow)" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif">
    <rect width="510" height="124" rx="22" fill="#f4f4f7"/>
    <rect x="20" y="18" width="46" height="46" rx="10" fill="#d97757"/>
    <g transform="translate(43 41)" stroke="#fff" stroke-width="4" stroke-linecap="round">
      <path d="M0 -14V14M-14 0H14M-10 -10L10 10M-10 10L10 -10"/>
    </g>
    <circle cx="86" cy="41" r="6" fill="#6d5bd0"/>
    <text x="100" y="50" fill="#5f6368" font-size="25">직전</text>
    <text x="164" y="51" fill="#1f2328" font-size="28" font-weight="700">552.5k</text>
    <text x="270" y="51" fill="#1f2328" font-size="28" font-weight="700">15.46초</text>
    <text x="392" y="51" fill="#6d5bd0" font-size="28" font-weight="700">82.2</text>
    <text x="452" y="49" fill="#5f6368" font-size="19">tk/s</text>
    <rect x="20" y="76" width="168" height="36" rx="18" fill="#2f9e5b"/>
    <text x="104" y="101" fill="#ffffff" font-size="20" text-anchor="middle">캐시 60분 남음</text>
    <text x="324" y="103" fill="#5f6368" font-size="23">모델</text>
    <text x="392" y="104" fill="#1f2328" font-size="26" font-weight="700">86.5</text>
    <text x="452" y="102" fill="#5f6368" font-size="19">tk/s</text>
  </g>
  <!-- Weekly line under it -->
  <g transform="translate(712 284)" filter="url(#shadow)" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif">
    <rect width="510" height="66" rx="18" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="24" y="28" fill="#c7d2fe" font-size="17">이번 주 사용량</text>
    <text x="24" y="52" fill="#ffffff" font-size="20" font-weight="600">나 31% · 다른 곳 7% · 계정 38%</text>
    <rect x="372" y="42" width="114" height="10" rx="5" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="372" y="42" width="35" height="10" rx="5" fill="#a78bfa"/>
    <rect x="405" y="42" width="8" height="10" fill="#f0abfc"/>
  </g>
</svg>
