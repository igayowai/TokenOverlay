<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9ecf5"/>
      <stop offset="1" stop-color="#dfe3f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1e1b4b" flood-opacity="0.22"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="600" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="600" fill="url(#desk)"/>

    <!-- A chat app window behind the overlay -->
    <g transform="translate(60 48)" filter="url(#shadow)">
      <rect width="1160" height="600" rx="16" fill="#ffffff"/>
      <rect width="1160" height="48" rx="16" fill="#f6f7fb"/>
      <rect y="32" width="1160" height="16" fill="#f6f7fb"/>
      <circle cx="28" cy="24" r="7" fill="#ff5f57"/><circle cx="52" cy="24" r="7" fill="#febc2e"/><circle cx="76" cy="24" r="7" fill="#28c840"/>
      <rect x="0" y="48" width="230" height="552" fill="#f9fafc"/>
      <g fill="#e3e6ef">
        <rect x="24" y="84" width="170" height="14" rx="7"/><rect x="24" y="118" width="140" height="14" rx="7"/>
        <rect x="24" y="152" width="160" height="14" rx="7"/><rect x="24" y="186" width="120" height="14" rx="7"/>
      </g>
      <g fill="#eceef5">
        <rect x="280" y="110" width="420" height="16" rx="8"/><rect x="280" y="140" width="380" height="16" rx="8"/>
        <rect x="280" y="170" width="300" height="16" rx="8"/>
        <rect x="280" y="236" width="400" height="16" rx="8"/><rect x="280" y="266" width="340" height="16" rx="8"/>
        <rect x="280" y="332" width="420" height="16" rx="8"/><rect x="280" y="362" width="190" height="16" rx="8"/>
      </g>
    </g>
  </g>

  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif">
    <!-- Capsule -->
    <g transform="translate(788 74)" filter="url(#shadow)">
      <rect width="390" height="58" rx="16" fill="#f4f4f7" stroke="#e2e4ec"/>
      <rect x="14" y="14" width="30" height="30" rx="7" fill="#10a37f"/>
      <circle cx="29" cy="29" r="8" fill="none" stroke="#fff" stroke-width="3"/>
      <circle cx="58" cy="29" r="4.5" fill="#6d5bd0"/>
      <text x="68" y="36" fill="#5f6368" font-size="18">직전</text>
      <text x="110" y="37" fill="#1f2328" font-size="21" font-weight="700">48.2k</text>
      <text x="180" y="37" fill="#1f2328" font-size="21" font-weight="700">31.07초</text>
      <text x="300" y="37" fill="#6d5bd0" font-size="21" font-weight="700">74.1</text>
      <text x="348" y="36" fill="#5f6368" font-size="15">tk/s</text>
    </g>

    <!-- Hover panel -->
    <g transform="translate(718 146)" filter="url(#shadow)">
      <rect width="460" height="398" rx="20" fill="#f4f4f7" stroke="#e2e4ec"/>
      <text x="28" y="48" fill="#1f2328" font-size="22" font-weight="700">최근 턴</text>
      <g fill="#6b7280" font-size="16">
        <text x="168" y="88" text-anchor="end">소모</text><text x="262" y="88" text-anchor="end">시간</text>
        <text x="342" y="88" text-anchor="end">전체</text><text x="424" y="88" text-anchor="end">모델</text>
      </g>
      <g font-size="17">
        <line x1="24" y1="102" x2="436" y2="102" stroke="#e2e4ec"/>
        <text x="28" y="132" fill="#6b7280">1턴 전</text>
        <text x="168" y="132" fill="#1f2328" font-weight="700" text-anchor="end">48.2k</text>
        <text x="262" y="132" fill="#1f2328" font-weight="700" text-anchor="end">31.07초</text>
        <text x="342" y="132" fill="#6d5bd0" font-weight="700" text-anchor="end">74.1</text>
        <text x="424" y="132" fill="#1f2328" font-weight="700" text-anchor="end">78.9</text>
        <line x1="24" y1="148" x2="436" y2="148" stroke="#e2e4ec"/>
        <text x="28" y="178" fill="#6b7280">2턴 전</text>
        <text x="168" y="178" fill="#1f2328" font-weight="700" text-anchor="end">905.7k</text>
        <text x="262" y="178" fill="#1f2328" font-weight="700" text-anchor="end">123.4초</text>
        <text x="342" y="178" fill="#6d5bd0" font-weight="700" text-anchor="end">71.3</text>
        <text x="424" y="178" fill="#1f2328" font-weight="700" text-anchor="end">75.6</text>
        <line x1="24" y1="194" x2="436" y2="194" stroke="#e2e4ec"/>
        <text x="28" y="224" fill="#6b7280">3턴 전</text>
        <text x="168" y="224" fill="#1f2328" font-weight="700" text-anchor="end">12.4k</text>
        <text x="262" y="224" fill="#1f2328" font-weight="700" text-anchor="end">8.92초</text>
        <text x="342" y="224" fill="#6d5bd0" font-weight="700" text-anchor="end">97.4</text>
        <text x="424" y="224" fill="#1f2328" font-weight="700" text-anchor="end">99.9</text>
        <line x1="24" y1="240" x2="436" y2="240" stroke="#e2e4ec"/>
      </g>

      <!-- Weekly share -->
      <text x="28" y="282" fill="#1f2328" font-size="17" font-weight="700">이번 주 10-15~</text>
      <text x="432" y="282" fill="#6b7280" font-size="15" text-anchor="end">10-22 15:14 초기화</text>
      <rect x="28" y="298" width="404" height="16" rx="8" fill="#e5e7ef"/>
      <rect x="28" y="298" width="125" height="16" rx="8" fill="#6d5bd0"/>
      <rect x="146" y="298" width="29" height="16" fill="#c084fc"/>
      <g font-size="16">
        <circle cx="34" cy="344" r="6" fill="#6d5bd0"/><text x="46" y="350" fill="#1f2328">나 31%</text>
        <circle cx="134" cy="344" r="6" fill="#c084fc"/><text x="146" y="350" fill="#1f2328">다른 곳 7%</text>
        <text x="432" y="350" fill="#1f2328" font-weight="700" text-anchor="end">계정 38%</text>
      </g>
      <text x="28" y="380" fill="#6b7280" font-size="14">PC·노트북 등 내 기기를 합쳐서 '나'로 셈</text>
    </g>

    <!-- Callouts -->
    <g filter="url(#shadow)" fill="#ffffff">
      <rect x="280" y="212" width="300" height="86" rx="14"/>
      <rect x="280" y="342" width="300" height="86" rx="14"/>
    </g>
    <g font-size="20" fill="#312e81" font-weight="700">
      <text x="300" y="250">① 한 턴이 끝나면 바로 표시</text>
      <text x="300" y="282" font-size="16" font-weight="400" fill="#4b5563">쓴 토큰 · 걸린 시간 · 초당 토큰</text>
      <text x="300" y="380">② 마우스를 올리면 자세히</text>
      <text x="300" y="412" font-size="16" font-weight="400" fill="#4b5563">최근 턴 기록과 이번 주 한도 사용량</text>
    </g>
    <g fill="none" stroke="#6d5bd0" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round">
      <path d="M580 246C680 232 740 150 784 112"/>
      <path d="M580 378C630 376 680 346 712 320"/>
    </g>
  </g>
</svg>
