<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1e1b4b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif">
    <!-- 1 -->
    <g transform="translate(10 12)" filter="url(#shadow)">
      <rect width="616" height="320" rx="28" fill="#ffffff" stroke="#e5e7ef"/>
      <rect x="40" y="40" width="88" height="88" rx="22" fill="#ede9fe"/>
      <g fill="none" stroke="#6d5bd0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="84" cy="84" r="25"/><path d="M84 66v18l13 10"/>
      </g>
      <text x="40" y="190" fill="#1f2328" font-size="42" font-weight="700">한 턴 통계</text>
      <text x="40" y="240" fill="#4b5563" font-size="29">쓴 토큰 · 걸린 시간 · 초당 토큰</text>
      <text x="40" y="282" fill="#6d5bd0" font-size="25" font-weight="700">Codex · Claude 둘 다</text>
    </g>
    <!-- 2 -->
    <g transform="translate(654 12)" filter="url(#shadow)">
      <rect width="616" height="320" rx="28" fill="#ffffff" stroke="#e5e7ef"/>
      <rect x="40" y="40" width="88" height="88" rx="22" fill="#fae8ff"/>
      <g fill="none" stroke="#a21caf" stroke-width="6" stroke-linecap="round">
        <path d="M84 59a25 25 0 1 1-25 25"/><path d="M84 59v25h-25"/>
      </g>
      <text x="40" y="190" fill="#1f2328" font-size="42" font-weight="700">주간 한도</text>
      <text x="40" y="240" fill="#4b5563" font-size="29">이번 주 사용량 중 내 몫 · 다른 곳 몫</text>
      <text x="40" y="282" fill="#a21caf" font-size="25" font-weight="700">초기화 시각도 표시</text>
    </g>
    <!-- 3 -->
    <g transform="translate(10 362)" filter="url(#shadow)">
      <rect width="616" height="320" rx="28" fill="#ffffff" stroke="#e5e7ef"/>
      <rect x="40" y="40" width="88" height="88" rx="22" fill="#dcfce7"/>
      <g fill="none" stroke="#15803d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="58" y="64" width="52" height="34" rx="5"/><path d="M72 110h24M84 98v12"/>
      </g>
      <text x="40" y="190" fill="#1f2328" font-size="42" font-weight="700">내 기기 합치기</text>
      <text x="40" y="240" fill="#4b5563" font-size="29">PC와 노트북 사용량을 묶어서 셈</text>
      <text x="40" y="282" fill="#15803d" font-size="25" font-weight="700">서버 없이, 내 구글 드라이브만</text>
    </g>
    <!-- 4 -->
    <g transform="translate(654 362)" filter="url(#shadow)">
      <rect width="616" height="320" rx="28" fill="#ffffff" stroke="#e5e7ef"/>
      <rect x="40" y="40" width="88" height="88" rx="22" fill="#e0f2fe"/>
      <g fill="none" stroke="#0369a1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M84 60v34M70 80l14 14 14-14"/><path d="M64 108h40"/>
      </g>
      <text x="40" y="190" fill="#1f2328" font-size="42" font-weight="700">자동 업데이트</text>
      <text x="40" y="240" fill="#4b5563" font-size="29">새 버전을 알아서 받아 둠</text>
      <text x="40" y="282" fill="#0369a1" font-size="25" font-weight="700">설치는 한 번만</text>
    </g>
  </g>
</svg>
